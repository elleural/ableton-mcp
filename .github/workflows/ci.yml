name: CI

# Offline suites only: unit, contract and the listening loop's ears package on synthetic fixtures.
# Live-dependent behaviour (tests/live) runs on the Mac against a real Ableton Live.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Unit and contract tests
        run: uv run pytest tests/unit tests/contract -q
      - name: Listening loop (ears) on synthetic fixtures
        run: uv run pytest tests/ears -q
      - name: Planted-defect calibration table
        run: uv run ears calibrate
