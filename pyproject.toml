[project]
name = "ableton-mcp"
version = "2.0.0"
description = "Ableton Live for AI agents over the Model Context Protocol: compose, arrange, mix, render and release"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"},
    {name = "Frederic Laruelle"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
ableton-mcp = "MCP_Server.cli:main"
ableton-mcp-debug = "MCP_Server.debugger:main"
ears = "ears.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The Remote Script ships in the wheel so `ableton-mcp install` can copy it into Live from any install.
include = ["MCP_Server*", "AbletonMCP_Remote_Script*", "ears*"]

[tool.setuptools.package-data]
ears = ["specs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a running Ableton Live with the AbletonMCP Remote Script loaded",
]
filterwarnings = [
    # sounddevice's own callback wrapper reshapes arrays in place (NumPy 2.5 deprecation), once per audio block
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:sounddevice",
]

[project.urls]
"Homepage" = "https://github.com/elleural/ableton-mcp"
"Bug Tracker" = "https://github.com/elleural/ableton-mcp/issues"
